name: Bug report
description: Something doesn't work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing this. The log output near the bottom is the single most useful
        thing you can give me — please include it if you can.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I've read the [known limitations](https://github.com/firatcansucu/fappswap/blob/main/docs/manual.md#known-limitations)
          required: true
        - label: If shortcuts stopped working after a rebuild, I've read [the signing gotcha](https://github.com/firatcansucu/fappswap/blob/main/CONTRIBUTING.md#the-ad-hoc-signing-gotcha)
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
      placeholder: I pressed ⌥F expecting Firefox to come forward, and nothing happened.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: If it's intermittent, say so and describe when it tends to happen.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Shortcuts (switching apps)
        - Snippets (text expansion)
        - Menu bar or preferences
        - Start at login
        - Install, permissions or Gatekeeper
        - Something else / not sure
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.5.1"
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: fappswap version
      description: Menu bar icon → About, or the version of the DMG you installed.
      placeholder: "1.2"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: |
        Reproduce the problem, then run this and paste the result. Automatically
        formatted as code — no backticks needed.
      value: |
        /usr/bin/log show --last 5m --predicate 'subsystem == "com.firatcansucu.fappswap"' --info
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Other keyboard utilities running? A specific app it only happens in? Screenshots?
